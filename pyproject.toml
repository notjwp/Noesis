# Declared, not left to pip's fallback: an installer that lets pip guess the
# backend is installing with whatever version the day's index serves.
[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "noesis"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "anthropic==0.122.0",
  "langgraph==1.2.11",
  "langgraph-checkpoint-sqlite==3.1.1",
  "openai==3.2.0",
  # Phase L. mcp is held below 2.0.0 because mcp-server-fetch declares mcp<2 -
  # measured, not assumed: 2.0.0 fails with ResolutionImpossible.
  "mcp==1.29.0",
  "mcp-server-fetch==2026.8.18",
  # Phase N: agentskills.io SKILL.md frontmatter.
  "pyyaml==6.0.2",
  # The TUI (FR-701). rich is pinned BELOW the version vendored in
  # eval/fixtures/real-rich, so a run that picks the wrong one is visible.
  "textual==8.0.1",
  "rich==14.3.3",
  # web_search (FR-501). It was installed in the Containerfile and declared
  # NOWHERE, so the container had it and every other install shipped a tool that
  # could only fail - which is what the TUI did, instantly, before any request.
  "ddgs==9.16.0",
]

# One word, from any directory. Pointed at __main__ and NOT agent.cli:main,
# because __main__ is what loads .env and runs the setup wizard - a script that
# skipped it would start with no API key, which is the defect eval/CHANGELOG.md
# records from when .env reached only containers.
[project.scripts]
noesis = "agent.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=9,<10"]

# The repository is a flat layout with four top-level directories, so setuptools
# refuses to guess which is the package. Only `agent` ships: `eval` and
# `prompts` are read from the source tree by path.
[tool.setuptools.packages.find]
include = ["agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
